<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administração</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231F2937'/%3E%3Cpath d='M20 44c0-14 10-24 26-26-2 16-12 26-26 26z' fill='%237DBE3C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="a-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
  <symbol id="a-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="a-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="a-box" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></symbol>
  <symbol id="a-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.7 7 9 4-1.3 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="a-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="a-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="a-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="a-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
  <symbol id="a-out" viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h11"/></symbol>
  <symbol id="a-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="a-whats" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.4L3 21l4.7-1.2A9 9 0 1 0 12 3z"/></symbol>
  <symbol id="a-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="a-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></symbol>
  <symbol id="a-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="a-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
  <symbol id="a-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="a-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="a-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.8"/><path d="m21 16-5.5-5.5L6 19"/></symbol>
  <symbol id="a-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="a-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="a-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<div class="adm" id="adm">
  <aside class="side" id="side">
    <a class="side__marca" href="../" target="_blank" rel="noopener" title="Abrir o site"><img src="../assets/img/logo.svg" alt="Logo"></a>
    <nav class="side__nav" id="nav">
      <a href="#visao" data-rota="visao"><svg><use href="#a-home"/></svg>Visão geral</a>
      <a href="#pedidos" data-rota="pedidos"><svg><use href="#a-bag"/></svg>Pedidos<i data-badge="pedidos" hidden></i></a>
      <a href="#clientes" data-rota="clientes"><svg><use href="#a-user"/></svg>Clientes</a>
      <a href="#atacado" data-rota="atacado"><svg><use href="#a-box"/></svg>Atacado<i data-badge="atacado" hidden></i></a>
      <a href="#fotos" data-rota="fotos"><svg><use href="#a-photo"/></svg>Produtos e fotos</a>
      <a href="#destaques" data-rota="destaques"><svg><use href="#a-star"/></svg>Destaques</a>
      <a href="#acessos" data-rota="acessos"><svg><use href="#a-shield"/></svg>Acessos<i data-badge="acessos" hidden></i></a>
    </nav>
    <div class="side__rodape">
      <span class="side__modo" id="modo"></span>
      <button class="btn btn--ghost btn--sm" id="sair"><svg><use href="#a-out"/></svg>Sair</button>
    </div>
  </aside>
  <main class="main">
    <header class="topo">
      <div><h1 id="titulo">Visão geral</h1><p id="subtitulo"></p></div>
      <div class="topo__acoes"><span class="topo__hora" id="hora"></span><button class="btn btn--soft btn--sm" id="atualizar"><svg><use href="#a-refresh"/></svg>Atualizar</button></div>
    </header>
    <div id="conteudo" class="conteudo"></div>
  </main>
</div>

<!-- Ficha do cliente -->
<div class="ficha" id="ficha" aria-hidden="true">
  <div class="ficha__fundo" data-fechar></div>
  <section class="ficha__painel" role="dialog" aria-modal="true" aria-label="Ficha do cliente" id="ficha-painel"></section>
</div>

<!-- Foto do produto -->
<div class="ficha" id="foto-ficha" aria-hidden="true">
  <div class="ficha__fundo" data-fechar-foto></div>
  <section class="ficha__painel" role="dialog" aria-modal="true" aria-label="Foto do produto" id="foto-painel"></section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/conta-api.js"></script>
<script src="../assets/js/endereco.js"></script>
<!-- catálogo e fotos (seção "Fotos") -->
<script src="../data/produtos.js"></script>
<script src="../data/produtos-ajustes.js"></script>
<script src="../data/destaques.js"></script>
<script src="../data/fotos.js"></script>
<script src="../data/fotos-reais.js"></script>
<script src="../data/fotos-unsplash.js"></script>
<script src="../data/fotos-ocultas.js"></script>
<script src="../assets/js/catalog.js"></script>
<script src="admin.js"></script>
<script src="admin-fotos.js"></script>
<script src="admin-destaques.js"></script>
</body>
</html>
